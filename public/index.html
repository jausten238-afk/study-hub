<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">

        <header>
            <h1>Study Hub</h1>
            <p>Organize your studying and stay productive.</p>
        </header>

        <main>
            <section class="task-section">
                <h2>My Tasks</h2>

                <div class="task-form">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a new task"
                    >

                    <button id="addTaskBtn">
                        Add Task
                    </button>
                </div>

                <ul id="taskList"></ul>
            </section>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
